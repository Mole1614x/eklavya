name: Phase 1 checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eklavya
          POSTGRES_USER: eklavya
          POSTGRES_PASSWORD: eklavya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eklavya -d eklavya"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check API, models and migrations
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/eklavya-api.log" 2>&1 &
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/api/v1/health
      - name: Check frontend and live API integration
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm test
