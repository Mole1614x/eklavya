name: EKLAVYA verification
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eklavya
          POSTGRES_USER: eklavya
          POSTGRES_PASSWORD: eklavya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eklavya -d eklavya"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check API, judge, and migrations
        working-directory: backend
        env:
          READINESS_CHECK_REDIS: "true"
        run: |
          pip install -r requirements-dev.txt
          python -m pip check
          PYTHONPATH=.. pytest tests ../judge/tests
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m app.seed
          python -m app.seed
          EKLAVYA_ADMIN_PASSWORD='UatAdminPass123!' python -m app.provision_admin --email uat_admin@example.com --username uat_admin --display-name 'UAT Administrator'
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/eklavya-api.log" 2>&1 &
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/api/v1/health/ready
          curl --fail --silent http://127.0.0.1:8000/api/v1/metrics | grep -F eklavya_http_requests_total

      - name: Audit Python runtime dependencies
        working-directory: backend
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip_audit -r requirements.txt

      - name: Check frontend and live API integration
        working-directory: frontend
        env:
          UAT_ADMIN_IDENTITY: uat_admin@example.com
          UAT_ADMIN_PASSWORD: UatAdminPass123!
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build
          npx playwright install chromium
          npm test

      - name: Validate container definitions
        run: |
          docker compose config --quiet
          docker build --check -f backend/Dockerfile .
          docker build --check -f frontend/Dockerfile frontend
          docker build --check -f judge/Dockerfile .
          docker build --check -f judge/images/code.Dockerfile .
          docker build --check -f judge/images/data.Dockerfile .
          docker build --check -f judge/images/bigdata.Dockerfile .
          docker build --check -f judge/images/ml.Dockerfile .
          docker build --check -f judge/images/deep-learning.Dockerfile .

      - name: Validate production and monitoring definitions
        env:
          POSTGRES_USER: eklavya_ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: eklavya
          PRODUCTION_DATABASE_URL: postgresql+psycopg://eklavya_ci:ci-postgres-password@db:5432/eklavya
          REDIS_PASSWORD: ci-redis-password
          PRODUCTION_REDIS_URL: redis://:ci-redis-password@redis:6379/0
          SECRET_KEY: ci-only-signing-key-with-at-least-thirty-two-characters
          PUBLIC_URL: https://ci.example.invalid
          ALLOWED_ORIGINS: https://ci.example.invalid
          ALLOWED_HOSTS: ci.example.invalid,backend
          TLS_CERTIFICATE_FILE: /tmp/ci-tls.crt
          TLS_PRIVATE_KEY_FILE: /tmp/ci-tls.key
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml --profile monitoring config --quiet
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -v "${PWD}/infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginxinc/nginx-unprivileged:1.27-alpine nginx -t
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=ci.example.invalid' -keyout "${RUNNER_TEMP}/ci-tls.key" -out "${RUNNER_TEMP}/ci-tls.crt"
          chmod 644 "${RUNNER_TEMP}/ci-tls.key" "${RUNNER_TEMP}/ci-tls.crt"
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -v "${PWD}/infrastructure/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro" -v "${RUNNER_TEMP}/ci-tls.crt:/run/secrets/tls.crt:ro" -v "${RUNNER_TEMP}/ci-tls.key:/run/secrets/tls.key:ro" nginxinc/nginx-unprivileged:1.27-alpine nginx -t
          docker run --rm --entrypoint promtool -v "${PWD}/infrastructure:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Smoke test the core Compose stack
        env:
          POSTGRES_PORT: "5433"
          BACKEND_PORT: "8011"
          FRONTEND_PORT: "3011"
        run: |
          docker compose up --build -d --wait --wait-timeout 120 db redis migrate backend frontend
          curl --fail --silent --show-error http://127.0.0.1:8011/api/v1/health/ready
          curl --fail --silent --show-error 'http://127.0.0.1:8011/api/v1/problems?limit=1' | jq -e '.total == 237'
          curl --fail --silent --show-error http://127.0.0.1:3011/problems/parity-check | grep -F 'Parity Check' > /dev/null
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:3011/monaco/vs/loader.js

      - name: Check all Pandas and NumPy reference exercises
        run: |
          docker build --file judge/images/data.Dockerfile --tag eklavya-data-runner:latest .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD/challenges:/work/challenges:ro" \
            --volume "$PWD/scripts:/work/scripts:ro" \
            --workdir /work eklavya-data-runner:latest \
            python scripts/verify_data_practice_references.py

      - name: Show service logs on failure
        if: failure()
        run: |
          cat "${RUNNER_TEMP}/eklavya-api.log" 2>/dev/null || true
          docker compose logs --no-color

      - name: Stop test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
