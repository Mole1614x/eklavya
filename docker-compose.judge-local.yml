# Only for trusted, local Docker Desktop development.
# Root is needed because Docker Desktop mounts docker.sock as root:root mode 0755.
# This grants the worker control over the Docker daemon: NEVER use on a public host.
services:
  judge:
    user: "0:0"
    environment:
      # Local Docker Desktop can take several seconds to create a runner.
      # This is a wall-clock allowance, NOT precise per-program CPU timing.
      JUDGE_CONTAINER_OVERHEAD_SECONDS: "15"
      JUDGE_RUNNER_CPUS: "2.0"
      JUDGE_RUNNER_MEMORY_MB: "512"
