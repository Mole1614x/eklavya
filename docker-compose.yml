services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eklavya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklavya}
      POSTGRES_DB: ${POSTGRES_DB:-eklavya}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://eklavya:eklavya@db:5432/eklavya}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://eklavya:eklavya@db:5432/eklavya}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-runner:
        condition: service_completed_successfully
      bigdata-runner:
        condition: service_completed_successfully
      ml-runner:
        condition: service_completed_successfully
      deep-learning-runner:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
  data-runner:
    image: eklavya-data-runner:latest
    build:
      context: .
      dockerfile: judge/images/data.Dockerfile
    command: ["true"]
    restart: "no"
  bigdata-runner:
    image: eklavya-bigdata-runner:latest
    build:
      context: .
      dockerfile: judge/images/bigdata.Dockerfile
    command: ["true"]
    restart: "no"
  ml-runner:
    image: eklavya-ml-runner:latest
    build:
      context: .
      dockerfile: judge/images/ml.Dockerfile
    command: ["true"]
    restart: "no"
  deep-learning-runner:
    image: eklavya-deep-learning-runner:latest
    build:
      context: .
      dockerfile: judge/images/deep-learning.Dockerfile
    command: ["true"]
    restart: "no"
  frontend:
    build:
      context: frontend
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres-data:
  redis-data:
