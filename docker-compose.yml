services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eklavya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eklavya}
      POSTGRES_DB: ${POSTGRES_DB:-eklavya}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://eklavya:eklavya@db:5432/eklavya}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://eklavya:eklavya@db:5432/eklavya}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-deployment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      READINESS_CHECK_REDIS: ${READINESS_CHECK_REDIS:-false}
      DATASET_STORAGE_DIR: /var/lib/eklavya/datasets
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      PUBLIC_CACHE_SECONDS: ${PUBLIC_CACHE_SECONDS:-30}
      JUDGE_STUCK_SECONDS: ${JUDGE_STUCK_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - dataset-storage:/var/lib/eklavya/datasets
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host':'backend'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://eklavya:eklavya@db:5432/eklavya}
      REDIS_URL: redis://redis:6379/0
      DATASET_STORAGE_DIR: /var/lib/eklavya/datasets
      DATABASE_POOL_SIZE: ${JUDGE_DATABASE_POOL_SIZE:-4}
      DATABASE_MAX_OVERFLOW: ${JUDGE_DATABASE_MAX_OVERFLOW:-4}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      JUDGE_STUCK_SECONDS: ${JUDGE_STUCK_SECONDS:-60}
    profiles: ["judge"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      python-runner:
        condition: service_completed_successfully
      code-runner:
        condition: service_completed_successfully
      java-runner:
        condition: service_completed_successfully
      linux-runner:
        condition: service_completed_successfully
      data-runner:
        condition: service_completed_successfully
      bigdata-runner:
        condition: service_completed_successfully
      ml-runner:
        condition: service_completed_successfully
      deep-learning-runner:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dataset-storage:/var/lib/eklavya/datasets:ro
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  python-runner:
    image: python:3.12-alpine
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  code-runner:
    image: eklavya-code-runner:latest
    build:
      context: .
      dockerfile: judge/images/code.Dockerfile
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  java-runner:
    image: eclipse-temurin:21-jdk-alpine
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  linux-runner:
    image: alpine:3.21
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  data-runner:
    image: eklavya-data-runner:latest
    build:
      context: .
      dockerfile: judge/images/data.Dockerfile
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  bigdata-runner:
    image: eklavya-bigdata-runner:latest
    build:
      context: .
      dockerfile: judge/images/bigdata.Dockerfile
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  ml-runner:
    image: eklavya-ml-runner:latest
    build:
      context: .
      dockerfile: judge/images/ml.Dockerfile
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  deep-learning-runner:
    image: eklavya-deep-learning-runner:latest
    build:
      context: .
      dockerfile: judge/images/deep-learning.Dockerfile
    command: ["true"]
    restart: "no"
    profiles: ["judge"]
  frontend:
    build:
      context: frontend
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      HOSTNAME: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres-data:
  redis-data:
  dataset-storage:
