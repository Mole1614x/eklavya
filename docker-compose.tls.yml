services:
  proxy:
    ports: !override
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes: !override
      - ./infrastructure/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_FILE:?Set TLS_CERTIFICATE_FILE}:/run/secrets/tls.crt:ro
      - ${TLS_PRIVATE_KEY_FILE:?Set TLS_PRIVATE_KEY_FILE}:/run/secrets/tls.key:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 5s
      timeout: 3s
      retries: 15
